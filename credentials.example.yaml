# Private nb-connect credentials.
# Copy this file to ~/.config/nb-connect/credentials.yaml, replace the
# placeholder token(s), and keep the resulting file out of source control:
#   install -m 0600 credentials.example.yaml ~/.config/nb-connect/credentials.yaml
# Override the path with --credentials or NBCON_CREDENTIALS.
#
# Every server in config.yaml needs a matching entry here to sync.
# Names match case-insensitively; tokens are trimmed and empty counts as missing.
# Tokens starting with nbt_ are sent as Bearer auth, all others as Token auth.
netbox:
  servers:
    production:
      token: replace-with-your-netbox-api-token
    # lab:
    #   token: replace-with-your-lab-netbox-api-token

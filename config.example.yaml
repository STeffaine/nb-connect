# Public nb-connect configuration.
# Copy this file to ~/.config/nb-connect/config.yaml.

netbox:
  # Add one or more named NetBox servers. Do not include /api/ in URLs.
  servers:
    - name: production
      url: https://netbox.example.com
      # Optional per-server SSH settings. When present, this block fully
      # replaces the global ssh block below for this server only.
      # ssh:
      #   default_user: prod-admin
      #   keys:
      #     prod-admin:
      #       identity_file: ~/.ssh/id_prod_admin

services:
  # Only these NetBox service names are cached and shown by nbcon.
  # Service matching ignores case and surrounding whitespace.
  enabled:
    - sshd
    # - telnet

ssh:
  # Global SSH settings, used by every NetBox server without its own ssh block.
  # Used by the SSH connector for matching NetBox SSH services.
  default_user: admin
  keys:
    admin:
      # Optional. Use an absolute path or ~/... for this user's private key.
      identity_file: ~/.ssh/id_admin

cache:
  # Go duration syntax; for example: 15m, 1h, or 24h.
  ttl: 15m

ping:
  # Number of ICMP echo requests sent by the TUI ping action.
  count: 4